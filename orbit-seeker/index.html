<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e27">
<title>星轨寻数 - Orbit Seeker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0e27;
  --bg2: #050714;
  --cyan: #00d4ff;
  --gold: #ffd700;
  --red: #ff4757;
  --pink: #ff6b9d;
  --text: #e0e6f5;
  --dim: #5a6a8a;
  --cell-bg: rgba(20, 30, 60, 0.6);
  --cell-border: rgba(0, 212, 255, 0.15);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  min-height: 100vh;
  position: relative;
}

#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.5; } }

.screen {
  position: relative; z-index: 1; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
}
.screen.hidden { display: none; }

/* Start Screen */
.game-title { font-size: 30px; font-weight: 600; color: var(--cyan); text-shadow: 0 0 20px rgba(0,212,255,0.4); margin-bottom: 2px; }
.game-subtitle { font-size: 12px; color: var(--dim); letter-spacing: 3px; margin-bottom: 28px; }
.game-desc { font-size: 13px; color: var(--dim); text-align: center; margin-bottom: 36px; line-height: 1.7; max-width: 280px; }

.diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 300px; margin-bottom: 28px; }
.diff-btn {
  background: var(--cell-bg); border: 1px solid var(--cell-border); border-radius: 12px;
  padding: 18px 14px; cursor: pointer; transition: all 0.2s; text-align: center; color: var(--text);
  touch-action: manipulation;
}
.diff-btn:active { transform: scale(0.94); background: rgba(0,212,255,0.12); border-color: rgba(0,212,255,0.4); }
.diff-size { font-size: 20px; font-weight: 600; color: var(--cyan); margin-bottom: 4px; }
.diff-best { font-size: 11px; color: var(--dim); display: flex; align-items: center; justify-content: center; gap: 4px; }
.rating-tag { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 700; }

.tip { font-size: 12px; color: var(--dim); text-align: center; max-width: 260px; line-height: 1.6; }

/* Game Screen */
.game-header { width: 100%; max-width: 340px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; }
.timer-display { font-family: 'SF Mono', 'Courier New', monospace; font-size: 22px; font-weight: 600; color: var(--cyan); }
.progress-display { font-size: 13px; color: var(--dim); font-family: 'SF Mono', 'Courier New', monospace; }

.next-number { text-align: center; margin-bottom: 14px; font-size: 13px; color: var(--dim); }
.next-number .num {
  display: inline-block; font-size: 26px; font-weight: 600; color: var(--gold);
  text-shadow: 0 0 12px rgba(255,215,0,0.4); margin-left: 8px; animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.grid-container {
  display: grid; gap: 6px; width: min(88vw, 340px); aspect-ratio: 1; position: relative;
}
.grid-cell {
  display: flex; align-items: center; justify-content: center;
  background: var(--cell-bg); border: 1px solid var(--cell-border); border-radius: 10px;
  font-weight: 600; color: var(--cyan); text-shadow: 0 0 8px rgba(0,212,255,0.3);
  cursor: pointer; transition: transform 0.12s, background 0.2s, border-color 0.2s, color 0.3s;
  position: relative; overflow: hidden; touch-action: manipulation;
}
.grid-cell:active { transform: scale(0.92); }
.grid-cell.found {
  background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.12);
  color: rgba(255,215,0,0.15); text-shadow: none;
}
.grid-cell.correct-tap { animation: correctTap 0.4s ease-out; }
@keyframes correctTap {
  0% { transform: scale(1); }
  40% { transform: scale(1.18); box-shadow: 0 0 25px rgba(255,215,0,0.5); border-color: rgba(255,215,0,0.7); }
  100% { transform: scale(1); }
}
.grid-cell.wrong-tap { animation: wrongTap 0.25s ease-out; }
@keyframes wrongTap { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.grid-cell.all-found { animation: allFound 0.6s ease-out; }
@keyframes allFound { 0%, 100% { box-shadow: 0 0 0 rgba(255,215,0,0); } 50% { box-shadow: 0 0 20px rgba(255,215,0,0.4); border-color: rgba(255,215,0,0.5); } }

.fixation-dot {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 5px; height: 5px; background: rgba(255,107,157,0.25); border-radius: 50%;
  pointer-events: none; z-index: 10;
}

/* Particles */
.particle {
  position: fixed; width: 6px; height: 6px; background: var(--gold); border-radius: 50%;
  box-shadow: 0 0 8px var(--gold); pointer-events: none; z-index: 100;
  animation: pBurst 0.6s ease-out forwards;
}
@keyframes pBurst { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; } }

/* Trails */
.trails-svg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* Countdown */
.countdown {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 72px; font-weight: 700; color: var(--cyan);
  text-shadow: 0 0 40px rgba(0,212,255,0.5); z-index: 200;
  animation: cdPulse 0.8s ease-out;
}
@keyframes cdPulse { 0% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; } 30% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.7); opacity: 0; } }

/* Result Screen */
.result-rating { font-size: 60px; font-weight: 700; margin-bottom: 6px; animation: rPop 0.5s ease-out; }
@keyframes rPop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
.result-time { font-family: 'SF Mono','Courier New',monospace; font-size: 34px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.result-meta { font-size: 13px; color: var(--dim); margin-bottom: 28px; }
.result-buttons { display: flex; gap: 12px; }
.btn { padding: 13px 26px; border-radius: 12px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; touch-action: manipulation; }
.btn-primary { background: var(--cyan); color: var(--bg); box-shadow: 0 0 20px rgba(0,212,255,0.25); }
.btn-primary:active { transform: scale(0.94); }
.btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.12); }
.btn-secondary:active { transform: scale(0.94); }
.new-best { color: var(--gold); font-size: 15px; font-weight: 600; text-shadow: 0 0 10px rgba(255,215,0,0.4); margin-bottom: 12px; animation: pulse 1s ease-in-out infinite; }

.rating-S { color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.5); }
.rating-A { color: var(--cyan); text-shadow: 0 0 25px rgba(0,212,255,0.4); }
.rating-B { color: var(--pink); text-shadow: 0 0 20px rgba(255,107,157,0.3); }
.rating-C { color: var(--dim); }
</style>
</head>
<body>

<div id="starfield"></div>

<div id="start-screen" class="screen">
  <div class="game-title">星轨寻数</div>
  <div class="game-subtitle">ORBIT SEEKER</div>
  <div class="game-desc">按顺序点击 1 到 N，越快越好<br>尝试注视中心点，用余光寻找数字</div>
  <div class="diff-grid" id="diff-grid"></div>
  <div class="tip">训练：视觉搜索 / 选择性注意 / 周边视觉</div>
</div>

<div id="game-screen" class="screen hidden">
  <div class="game-header">
    <div class="timer-display" id="timer">0.0s</div>
    <div class="progress-display" id="progress">0/0</div>
  </div>
  <div class="next-number">下一个<span class="num" id="next-num">1</span></div>
  <div class="grid-container" id="grid"></div>
</div>

<div id="result-screen" class="screen hidden">
  <div id="new-best-badge" class="new-best" style="display:none;">NEW BEST!</div>
  <div class="result-rating" id="r-rating">S</div>
  <div class="result-time" id="r-time">0.0s</div>
  <div class="result-meta" id="r-meta"></div>
  <div class="result-buttons">
    <button class="btn btn-primary" id="btn-replay">再来一局</button>
    <button class="btn btn-secondary" id="btn-home">返回首页</button>
  </div>
</div>

<svg class="trails-svg" id="trails-svg" style="display:none;"></svg>

<script>
var RATINGS = {
  3: { S: 8,  A: 12, B: 20 },
  4: { S: 15, A: 22, B: 35 },
  5: { S: 20, A: 30, B: 45 },
  6: { S: 35, A: 50, B: 70 }
};
var RATING_COLORS = { S: '#ffd700', A: '#00d4ff', B: '#ff6b9d', C: '#5a6a8a' };
var STORAGE_KEY = 'mindGalaxy_orbitSeeker';

var gridSize = 5;
var numbers = [];
var currentTarget = 1;
var foundCount = 0;
var startTime = null;
var timerInterval = null;
var wrongTaps = 0;
var cellElements = [];
var foundCellsOrder = [];

// --- Storage ---
function loadData() {
  try { var d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : { bests: {} }; }
  catch(e) { return { bests: {} }; }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {} }
function getBest(size) { return loadData().bests[size] || null; }
function saveBest(size, time, rating) {
  var d = loadData();
  var ex = d.bests[size];
  if (!ex || time < ex.time) { d.bests[size] = { time: time, rating: rating, date: new Date().toISOString() }; saveData(d); return true; }
  return false;
}

// --- Starfield ---
function createStarfield() {
  var sf = document.getElementById('starfield');
  for (var i = 0; i < 80; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    var sz = Math.random() * 2 + 0.5;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.animationDuration = (Math.random() * 3 + 2) + 's';
    sf.appendChild(s);
  }
}

// --- Screen management ---
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}

// --- Start screen ---
function renderStartScreen() {
  var grid = document.getElementById('diff-grid');
  grid.innerHTML = '';
  [3, 4, 5, 6].forEach(function(size) {
    var btn = document.createElement('button');
    btn.className = 'diff-btn';
    var best = getBest(size);
    var bestHtml;
    if (best) {
      var c = RATING_COLORS[best.rating] || '#5a6a8a';
      bestHtml = '<div class="diff-best">' + best.time.toFixed(1) + 's <span class="rating-tag" style="background:' + c + '22;color:' + c + '">' + best.rating + '</span></div>';
    } else {
      bestHtml = '<div class="diff-best">未挑战</div>';
    }
    btn.innerHTML = '<div class="diff-size">' + size + '\u00d7' + size + '</div>' + bestHtml;
    btn.onclick = function() { startGame(size); };
    grid.appendChild(btn);
  });
}

// --- Game ---
function startGame(size) {
  gridSize = size;
  currentTarget = 1;
  foundCount = 0;
  wrongTaps = 0;
  foundCellsOrder = [];
  numbers = [];

  var total = size * size;
  for (var i = 1; i <= total; i++) numbers.push(i);
  for (var i = numbers.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = numbers[i]; numbers[i] = numbers[j]; numbers[j] = tmp;
  }

  showScreen('game-screen');
  countdown(3, function() { renderGrid(); startTimer(); });
}

function countdown(n, callback) {
  var existing = document.querySelector('.countdown');
  if (n === 0) {
    if (existing) {
      existing.textContent = 'GO';
      existing.style.animation = 'none';
      void existing.offsetHeight;
      existing.style.animation = 'cdPulse 0.6s ease-out';
      setTimeout(function() { if (existing.parentNode) existing.remove(); callback(); }, 500);
    } else { callback(); }
    return;
  }
  var cd = existing;
  if (!cd) { cd = document.createElement('div'); cd.className = 'countdown'; document.body.appendChild(cd); }
  cd.textContent = n;
  cd.style.animation = 'none';
  void cd.offsetHeight;
  cd.style.animation = 'cdPulse 0.8s ease-out';
  setTimeout(function() { countdown(n - 1, callback); }, 800);
}

function renderGrid() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  cellElements = [];

  var fontSize = gridSize === 3 ? 32 : gridSize === 4 ? 28 : gridSize === 5 ? 24 : 20;
  grid.style.gridTemplateColumns = 'repeat(' + gridSize + ', 1fr)';

  numbers.forEach(function(num, idx) {
    var cell = document.createElement('div');
    cell.className = 'grid-cell';
    cell.textContent = num;
    cell.style.fontSize = fontSize + 'px';
    cell.dataset.num = num;
    cell.dataset.idx = idx;
    cell.addEventListener('click', function() { handleTap(cell, num); });
    grid.appendChild(cell);
    cellElements.push(cell);
  });

  var dot = document.createElement('div');
  dot.className = 'fixation-dot';
  grid.appendChild(dot);

  updateProgress();
}

function handleTap(cell, num) {
  if (cell.classList.contains('found')) return;

  if (num === currentTarget) {
    cell.classList.add('found', 'correct-tap');
    setTimeout(function() { cell.classList.remove('correct-tap'); }, 400);
    createBurst(cell);
    foundCellsOrder.push(cell);
    if (foundCellsOrder.length >= 2) drawTrail(foundCellsOrder[foundCellsOrder.length - 2], cell);
    foundCount++;
    currentTarget++;
    if (navigator.vibrate) navigator.vibrate(30);
    updateProgress();
    if (foundCount === gridSize * gridSize) gameComplete();
  } else {
    cell.classList.add('wrong-tap');
    setTimeout(function() { cell.classList.remove('wrong-tap'); }, 250);
    wrongTaps++;
    if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
  }
}

function createBurst(cell) {
  var rect = cell.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  for (var i = 0; i < 10; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    var angle = (i / 10) * Math.PI * 2;
    var dist = 35 + Math.random() * 25;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    (function(particle) { setTimeout(function() { if (particle.parentNode) particle.remove(); }, 600); })(p);
  }
}

function drawTrail(fromCell, toCell) {
  var svg = document.getElementById('trails-svg');
  svg.style.display = 'block';
  var fr = fromCell.getBoundingClientRect();
  var tr = toCell.getBoundingClientRect();
  var x1 = fr.left + fr.width / 2;
  var y1 = fr.top + fr.height / 2;
  var x2 = tr.left + tr.width / 2;
  var y2 = tr.top + tr.height / 2;
  var length = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));

  var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x2);
  line.setAttribute('y2', y2);
  line.setAttribute('stroke', '#ffd700');
  line.setAttribute('stroke-width', '2');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('opacity', '0.6');
  line.setAttribute('stroke-dasharray', length);
  line.setAttribute('stroke-dashoffset', length);
  line.style.filter = 'drop-shadow(0 0 4px rgba(255,215,0,0.5))';
  svg.appendChild(line);

  requestAnimationFrame(function() {
    line.style.transition = 'stroke-dashoffset 0.35s ease-out';
    line.setAttribute('stroke-dashoffset', '0');
  });

  setTimeout(function() {
    line.style.transition = 'opacity 0.4s ease-out';
    line.setAttribute('opacity', '0');
    setTimeout(function() { if (line.parentNode) line.remove(); }, 400);
  }, 500);
}

function updateProgress() {
  document.getElementById('progress').textContent = foundCount + '/' + (gridSize * gridSize);
  var nextEl = document.getElementById('next-num');
  nextEl.textContent = currentTarget <= gridSize * gridSize ? currentTarget : '\u2713';
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(function() {
    var elapsed = (Date.now() - startTime) / 1000;
    document.getElementById('timer').textContent = elapsed.toFixed(1) + 's';
  }, 50);
}

function stopTimer() {
  clearInterval(timerInterval);
  return (Date.now() - startTime) / 1000;
}

function getRating(time, size) {
  var r = RATINGS[size];
  if (time <= r.S) return 'S';
  if (time <= r.A) return 'A';
  if (time <= r.B) return 'B';
  return 'C';
}

function gameComplete() {
  var time = stopTimer();
  var rating = getRating(time, gridSize);
  var isNewBest = saveBest(gridSize, time, rating);

  // All cells glow
  cellElements.forEach(function(c) { c.classList.add('all-found'); });

  // Clear trails
  var svg = document.getElementById('trails-svg');

  setTimeout(function() {
    svg.innerHTML = '';
    svg.style.display = 'none';
    showScreen('result-screen');

    var ratingEl = document.getElementById('r-rating');
    ratingEl.textContent = rating;
    ratingEl.className = 'result-rating rating-' + rating;
    document.getElementById('r-time').textContent = time.toFixed(1) + 's';

    var best = getBest(gridSize);
    var meta = gridSize + '\u00d7' + gridSize;
    if (best && !isNewBest) meta += ' \u00b7 \u6700\u4f73 ' + best.time.toFixed(1) + 's';
    if (wrongTaps > 0) meta += ' \u00b7 \u8bef\u89e6 ' + wrongTaps + '\u6b21';
    document.getElementById('r-meta').textContent = meta;
    document.getElementById('new-best-badge').style.display = isNewBest ? 'block' : 'none';

    document.getElementById('btn-replay').onclick = function() { startGame(gridSize); };
    document.getElementById('btn-home').onclick = function() { renderStartScreen(); showScreen('start-screen'); };
  }, 800);
}

// --- Init ---
createStarfield();
renderStartScreen();
</script>
</body>
</html>
